<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Billing & Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./H-20-HiringSettings.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Billing & Plan</h3>
            <div class="w-11"></div>
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar gap-6 mt-6">
            
            <!-- Current Plan -->
            <div class="bg-surfaceAlt border border-border rounded-md p-5 flex flex-col">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-[10px] text-textSecondary uppercase tracking-wider font-bold mb-1">Current Plan</p>
                        <h2 class="text-h2 font-bold text-white">Pro Studio</h2>
                    </div>
                    <div class="px-2 py-1 bg-primary/20 text-primary border border-primary/30 rounded text-[10px] font-bold">ACTIVE</div>
                </div>
                
                <h3 class="text-[28px] font-bold text-white mb-4">₹4,999<span class="text-caption text-textSecondary font-normal">/month</span></h3>
                
                <div class="flex flex-col gap-2 mb-6">
                    <div class="flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4 text-primary"></i>
                        <span class="text-caption text-white">Unlimited Audition Posts</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4 text-primary"></i>
                        <span class="text-caption text-white">Advanced Artist Search</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4 text-primary"></i>
                        <span class="text-caption text-white">Up to 5 Team Members</span>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button class="flex-1 py-2 bg-primary text-textOnPrimary rounded text-caption font-bold active:bg-primaryPressed">Upgrade</button>
                    <button class="flex-1 py-2 bg-surface border border-border text-textSecondary rounded text-caption font-bold active:bg-surfaceAlt">Cancel</button>
                </div>
            </div>

            <!-- Payment Methods -->
            <div>
                <h4 class="text-bodyBold text-white mb-3">Payment Method</h4>
                <div class="bg-surface border border-border rounded-md overflow-hidden">
                    <div class="p-4 flex items-center justify-between border-b border-border">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-6 bg-white rounded flex items-center justify-center px-1">
                                <span class="text-[10px] font-bold text-blue-800 italic">VISA</span>
                            </div>
                            <div>
                                <p class="text-body font-semibold text-white">•••• 4242</p>
                                <p class="text-[10px] text-textSecondary">Expires 12/28</p>
                            </div>
                        </div>
                        <i data-lucide="more-vertical" class="w-5 h-5 text-textSecondary cursor-pointer"></i>
                    </div>
                    <button class="w-full p-4 flex items-center justify-center gap-2 text-primary text-caption font-bold active:bg-surfaceAlt">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add Payment Method
                    </button>
                </div>
            </div>

            <button onclick="window.location.href='./H-19-TransactionHistory.html'" class="w-full p-4 bg-surface border border-border rounded-md flex justify-between items-center active:bg-surfaceAlt">
                <div class="flex items-center gap-3">
                    <i data-lucide="receipt" class="w-5 h-5 text-textSecondary"></i>
                    <span class="text-body text-white font-semibold">Transaction History</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-textSecondary"></i>
            </button>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
