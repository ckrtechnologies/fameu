<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[72px] mt-8 px-4 flex items-center justify-between shrink-0 border-b border-border bg-background z-10">
            <h1 class="text-h1 font-semibold text-white">Messages</h1>
            <div class="flex items-center gap-3">
                <button class="w-10 h-10 bg-surface border border-border rounded-full flex items-center justify-center text-textSecondary active:bg-surfaceAlt">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto pb-24 flex flex-col hide-scrollbar bg-background">
            
            <!-- Chat Item 1 (Unread) -->
            <div class="p-4 border-b border-border flex items-center gap-4 bg-primary/5 cursor-pointer active:bg-surfaceAlt" onclick="window.location.href='./H-23-ChatThread.html'">
                <div class="w-14 h-14 bg-surface rounded-full border border-border shrink-0 overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=150&h=150" class="w-full h-full object-cover">
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-success rounded-full border-2 border-background"></div>
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="flex justify-between items-start mb-0.5">
                        <h4 class="text-bodyBold text-white truncate">Karan Singh</h4>
                        <span class="text-[10px] text-textSecondary shrink-0 mt-0.5">10:45 AM</span>
                    </div>
                    <p class="text-caption text-white font-semibold truncate">Yes, 2 PM tomorrow works perfectly for me...</p>
                </div>
                <div class="w-2.5 h-2.5 bg-primary rounded-full shrink-0"></div>
            </div>

            <!-- Chat Item 2 -->
            <div class="p-4 border-b border-border flex items-center gap-4 cursor-pointer active:bg-surfaceAlt">
                <div class="w-14 h-14 bg-surface rounded-full border border-border shrink-0 overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150&h=150" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="flex justify-between items-start mb-0.5">
                        <h4 class="text-bodyBold text-white truncate">Priya Singh</h4>
                        <span class="text-[10px] text-textSecondary shrink-0 mt-0.5">Yesterday</span>
                    </div>
                    <p class="text-caption text-textSecondary truncate">Thank you for the opportunity!</p>
                </div>
            </div>

            <!-- Chat Item 3 -->
            <div class="p-4 border-b border-border flex items-center gap-4 cursor-pointer active:bg-surfaceAlt">
                <div class="w-14 h-14 bg-surface rounded-full border border-border shrink-0 overflow-hidden relative opacity-50">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=150&h=150" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="flex justify-between items-start mb-0.5">
                        <h4 class="text-bodyBold text-white truncate opacity-50">Vikram Rao</h4>
                        <span class="text-[10px] text-textSecondary shrink-0 mt-0.5">Oct 12</span>
                    </div>
                    <p class="text-caption text-textSecondary truncate italic flex items-center gap-1">
                        <i data-lucide="clock" class="w-3 h-3"></i> Request Pending
                    </p>
                </div>
            </div>

        </div>

        <!-- Bottom Tabs -->
        <div class="h-[80px] bg-surface border-t border-border px-6 flex justify-between items-center absolute bottom-0 w-full pb-4 pt-2">
            <button onclick="window.location.href='./H-6-HiringDashboard.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Dashboard</span>
            </button>
            <button onclick="window.location.href='./H-8-ManageAuditions.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="briefcase" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Auditions</span>
            </button>
            <button onclick="window.location.href='./H-14-ArtistSearch.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="users" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Talent</span>
            </button>
            <button class="flex flex-col items-center gap-1 min-w-[56px] text-primary relative">
                <div class="absolute -top-1 -right-1 w-3 h-3 bg-error rounded-full border-2 border-surface"></div>
                <i data-lucide="message-square" class="w-6 h-6 fill-primary/20"></i>
                <span class="text-[10px] font-semibold">Chat</span>
            </button>
            <button onclick="window.location.href='./H-4-CompanyProfile.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Profile</span>
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
