<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Talent Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="px-4 mt-12 mb-4 shrink-0">
            <h1 class="text-h2 font-semibold text-white mb-4">Discover Talent</h1>
            
            <div class="flex gap-2">
                <div class="flex-1 bg-surfaceAlt border border-border rounded-full h-11 flex items-center px-4">
                    <i data-lucide="search" class="w-5 h-5 text-textSecondary mr-2"></i>
                    <input type="text" placeholder="Search actors, models..." class="w-full bg-transparent border-none outline-none text-body text-white">
                </div>
                <button class="w-11 h-11 bg-surface border border-border rounded-full flex items-center justify-center text-textSecondary active:bg-surfaceAlt">
                    <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div class="w-full overflow-x-auto hide-scrollbar shrink-0 border-b border-border bg-surfaceAlt/30 py-3 px-4 flex gap-2">
            <button class="px-4 py-1.5 bg-primary text-textOnPrimary text-caption font-semibold rounded-full whitespace-nowrap">All</button>
            <button class="px-4 py-1.5 bg-surface border border-border text-textSecondary text-caption font-semibold rounded-full whitespace-nowrap active:bg-surfaceAlt">Actors</button>
            <button class="px-4 py-1.5 bg-surface border border-border text-textSecondary text-caption font-semibold rounded-full whitespace-nowrap active:bg-surfaceAlt">Models</button>
            <button class="px-4 py-1.5 bg-surface border border-border text-textSecondary text-caption font-semibold rounded-full whitespace-nowrap active:bg-surfaceAlt">Dancers</button>
        </div>

        <div class="flex-1 overflow-y-auto pb-24 p-4 grid grid-cols-2 gap-4 hide-scrollbar">
            
            <!-- Talent 1 -->
            <div class="bg-surfaceAlt border border-border rounded-md overflow-hidden cursor-pointer active:opacity-80" onclick="window.location.href='./H-15-ArtistProfileView.html'">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&q=80&w=200&h=250" class="w-full h-[160px] object-cover">
                <div class="p-3">
                    <div class="flex items-center gap-1 mb-0.5">
                        <h4 class="text-caption font-bold text-white truncate">Rahul Sharma</h4>
                        <i data-lucide="shield-check" class="w-3 h-3 text-success shrink-0"></i>
                    </div>
                    <p class="text-[10px] text-textSecondary">Actor • 28 yrs</p>
                </div>
            </div>
            
            <!-- Talent 2 -->
            <div class="bg-surfaceAlt border border-border rounded-md overflow-hidden cursor-pointer active:opacity-80" onclick="window.location.href='./H-15-ArtistProfileView.html'">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&q=80&w=200&h=250" class="w-full h-[160px] object-cover">
                <div class="p-3">
                    <h4 class="text-caption font-bold text-white truncate mb-0.5">Aditya Verma</h4>
                    <p class="text-[10px] text-textSecondary">Model • 26 yrs</p>
                </div>
            </div>

            <!-- Talent 3 -->
            <div class="bg-surfaceAlt border border-border rounded-md overflow-hidden cursor-pointer active:opacity-80" onclick="window.location.href='./H-15-ArtistProfileView.html'">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200&h=250" class="w-full h-[160px] object-cover">
                <div class="p-3">
                    <div class="flex items-center gap-1 mb-0.5">
                        <h4 class="text-caption font-bold text-white truncate">Priya Singh</h4>
                        <i data-lucide="shield-check" class="w-3 h-3 text-success shrink-0"></i>
                    </div>
                    <p class="text-[10px] text-textSecondary">Dancer • 24 yrs</p>
                </div>
            </div>

            <!-- Talent 4 -->
            <div class="bg-surfaceAlt border border-border rounded-md overflow-hidden cursor-pointer active:opacity-80" onclick="window.location.href='./H-15-ArtistProfileView.html'">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=200&h=250" class="w-full h-[160px] object-cover">
                <div class="p-3">
                    <h4 class="text-caption font-bold text-white truncate mb-0.5">Vikram Rao</h4>
                    <p class="text-[10px] text-textSecondary">Actor • 35 yrs</p>
                </div>
            </div>

        </div>

        <!-- Bottom Tabs -->
        <div class="h-[80px] bg-surface border-t border-border px-6 flex justify-between items-center absolute bottom-0 w-full pb-4 pt-2">
            
            <button onclick="window.location.href='./H-6-HiringDashboard.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Dashboard</span>
            </button>

            <button onclick="window.location.href='./H-8-ManageAuditions.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="briefcase" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Auditions</span>
            </button>

            <button class="flex flex-col items-center gap-1 min-w-[56px] text-primary relative">
                <i data-lucide="users" class="w-6 h-6 fill-primary/20"></i>
                <span class="text-[10px] font-semibold">Talent</span>
            </button>

            <button onclick="window.location.href='./H-22-ChatList.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="message-square" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Chat</span>
            </button>

            <button onclick="window.location.href='./H-4-CompanyProfile.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Profile</span>
            </button>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
