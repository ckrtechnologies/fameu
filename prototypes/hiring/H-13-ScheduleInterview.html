<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Schedule Interview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./H-12-ShortlistedCandidates.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Schedule Meet</h3>
            <div class="w-11"></div>
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar gap-6 mt-6">
            
            <div class="flex items-center gap-3 bg-surfaceAlt border border-border p-3 rounded-md mb-2">
                <div class="w-10 h-10 bg-surface rounded-full overflow-hidden shrink-0">
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=150&h=150" class="w-full h-full object-cover">
                </div>
                <div>
                    <p class="text-[10px] text-textSecondary">Scheduling with</p>
                    <h4 class="text-bodyBold text-white leading-tight">Karan Singh</h4>
                </div>
            </div>

            <!-- Date -->
            <div class="flex flex-col gap-1">
                <label class="text-caption text-textSecondary font-semibold">Select Date</label>
                <input type="date" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors style-color-scheme-dark">
            </div>
            
            <style>
                input[type="date"]::-webkit-calendar-picker-indicator,
                input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
            </style>

            <div class="grid grid-cols-2 gap-4">
                <!-- Time -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Time</label>
                    <input type="time" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors style-color-scheme-dark">
                </div>

                <!-- Duration -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Duration</label>
                    <div class="relative">
                        <select class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 appearance-none focus:outline-none focus:border-primary transition-colors">
                            <option>15 mins</option>
                            <option>30 mins</option>
                            <option>1 hour</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary pointer-events-none"></i>
                    </div>
                </div>
            </div>

            <!-- Type -->
            <div class="flex flex-col gap-1">
                <label class="text-caption text-textSecondary font-semibold">Meeting Type</label>
                <div class="flex gap-2">
                    <button class="flex-1 h-[44px] bg-primary/20 border-2 border-primary text-primary rounded font-bold text-caption transition-colors">
                        In-Person
                    </button>
                    <button class="flex-1 h-[44px] bg-surface border border-border text-textSecondary rounded font-bold text-caption active:bg-surfaceAlt transition-colors">
                        Video Call
                    </button>
                </div>
            </div>

            <!-- Address/Link -->
            <div class="flex flex-col gap-1">
                <label class="text-caption text-textSecondary font-semibold">Studio Address</label>
                <textarea class="w-full h-20 bg-surface border border-border rounded-sm text-body text-textPrimary p-4 focus:outline-none focus:border-primary transition-colors resize-none">Andheri West Studio, Mumbai</textarea>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-caption text-textSecondary font-semibold">Note to Artist (Optional)</label>
                <input type="text" placeholder="e.g. Please bring a printed resume." class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
            </div>

            <!-- Primary Action -->
            <button onclick="window.location.href='./H-12-ShortlistedCandidates.html'; alert('Invite sent!');" class="w-full h-[52px] bg-primary text-textOnPrimary rounded-md text-bodyBold flex items-center justify-center shadow-lg active:bg-primaryPressed transition-colors mt-auto mb-2 gap-2">
                Send Invite <i data-lucide="send" class="w-4 h-4"></i>
            </button>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
