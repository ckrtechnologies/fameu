<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[56px] mt-12 px-2 flex items-center shrink-0">
            <button onclick="window.location.href='./HA-1-Onboarding.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col">
            
            <div class="mt-4 mb-8">
                <h1 class="text-h1 font-semibold text-white mb-2">Create Account</h1>
                <p class="text-body text-textSecondary">Join Fameu and start your artist journey today.</p>
            </div>

            <!-- Form -->
            <div class="flex flex-col gap-4 mb-8">
                <!-- Input Group: Email -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="email" placeholder="you@example.com" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <!-- Input Group: Password -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="password" placeholder="Min. 8 characters" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-12 focus:outline-none focus:border-primary transition-colors">
                        <button class="absolute right-3 top-1/2 -translate-y-1/2 text-textSecondary active:text-primary">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Primary Action -->
            <button onclick="window.location.href='./HA-3-Email-OTP.html'" class="w-full h-[52px] bg-primary text-textOnPrimary rounded-md text-bodyBold flex items-center justify-center shadow-lg active:bg-primaryPressed transition-colors mb-6">
                Continue
            </button>

            <!-- Divider -->
            <div class="flex items-center gap-4 mb-6">
                <div class="flex-1 h-[1px] bg-border"></div>
                <span class="text-caption text-textSecondary">OR CONTINUE WITH</span>
                <div class="flex-1 h-[1px] bg-border"></div>
            </div>

            <!-- Social Logins -->
            <div class="flex flex-col gap-3 mb-auto">
                <button class="w-full h-[52px] bg-surface border border-border rounded-md text-bodyBold flex items-center justify-center gap-3 active:bg-surfaceAlt transition-colors">
                    <!-- Placeholder SVG for Google -->
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
            </div>

            <!-- Login Link -->
            <div class="mt-8 text-center pb-4">
                <p class="text-body text-textSecondary">
                    Already have an account? 
                    <a href="./HA-5-Login.html" class="text-primary font-semibold underline-offset-4 hover:underline">Log In</a>
                </p>
            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
