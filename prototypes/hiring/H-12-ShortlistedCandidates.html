<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Shortlisted Candidates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[72px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border bg-background z-10">
            <button onclick="window.location.href='./H-8-ManageAuditions.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Shortlisted</h3>
            <button class="w-11 h-11 flex items-center justify-center text-textSecondary active:opacity-50">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto pb-6 flex flex-col hide-scrollbar bg-background">
            
            <div class="px-4 py-3 bg-surfaceAlt border-b border-border sticky top-0 z-10">
                <h4 class="text-[11px] font-bold text-textSecondary uppercase tracking-wider">Lead Actor - Prime Series (12)</h4>
            </div>
            
            <!-- Applicant 3 (Shortlisted) -->
            <div class="p-4 border-b border-border flex flex-col gap-3">
                
                <div class="flex items-start gap-4 cursor-pointer" onclick="window.location.href='./H-11-ApplicantDetail.html'">
                    <div class="w-12 h-12 bg-surface rounded-full border border-primary shrink-0 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=150&h=150" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1">
                        <h4 class="text-bodyBold text-white">Karan Singh</h4>
                        <div class="flex gap-2 mt-1">
                            <span class="px-2 py-0.5 bg-surface border border-border rounded text-[9px] text-textSecondary font-semibold">Actor</span>
                            <span class="px-2 py-0.5 bg-surface border border-border rounded text-[9px] text-textSecondary font-semibold">31 yrs</span>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-2">
                    <button onclick="window.location.href='./H-13-ScheduleInterview.html'" class="flex-1 h-9 bg-primary text-textOnPrimary rounded text-caption font-bold flex items-center justify-center gap-1 active:bg-primaryPressed">
                        <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Schedule
                    </button>
                    <button onclick="window.location.href='./H-23-ChatThread.html'" class="w-11 h-9 bg-surfaceAlt border border-border rounded flex items-center justify-center text-white active:bg-border">
                        <i data-lucide="message-square" class="w-4 h-4"></i>
                    </button>
                </div>

            </div>

            <!-- More Shortlisted here... -->

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
