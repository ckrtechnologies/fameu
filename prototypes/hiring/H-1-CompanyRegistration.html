<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Company Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./HA-5-Login.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Company Profile</h3>
            <div class="w-11"></div> <!-- Spacer -->
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar">
            
            <div class="mt-6 mb-6">
                <!-- Progress -->
                <div class="flex justify-between items-center mb-2">
                    <span class="text-caption text-textSecondary">Step 1 of 2: Basic Details</span>
                    <span class="text-caption font-semibold text-primary">50%</span>
                </div>
                <div class="w-full h-1 bg-surface rounded-full overflow-hidden">
                    <div class="w-1/2 h-full bg-primary"></div>
                </div>
            </div>

            <!-- Form -->
            <div class="flex flex-col gap-6 mb-8">
                
                <!-- Logo Upload -->
                <div class="flex flex-col items-center justify-center gap-3">
                    <div class="w-24 h-24 rounded-full bg-surface border border-border flex flex-col items-center justify-center relative overflow-hidden cursor-pointer active:bg-surfaceAlt">
                        <i data-lucide="image" class="w-8 h-8 text-textSecondary mb-1"></i>
                        <span class="text-[10px] text-textSecondary font-semibold uppercase">Upload</span>
                    </div>
                    <span class="text-caption text-textSecondary">Company Logo</span>
                </div>

                <!-- Company Name -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Production / Company Name <span class="text-error">*</span></label>
                    <input type="text" placeholder="e.g. Red Chillies Entertainment" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                </div>

                <!-- Company Type -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Company Type <span class="text-error">*</span></label>
                    <div class="relative">
                        <select class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 appearance-none focus:outline-none focus:border-primary transition-colors">
                            <option>Production House</option>
                            <option>Casting Agency</option>
                            <option>Ad Agency</option>
                            <option>Brand / Corporate</option>
                            <option>Independent Filmmaker</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary pointer-events-none"></i>
                    </div>
                </div>

                <!-- Website -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Website (Optional)</label>
                    <div class="relative">
                        <i data-lucide="globe" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="url" placeholder="https://" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <!-- Address -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Headquarters / City <span class="text-error">*</span></label>
                    <div class="relative">
                        <i data-lucide="map-pin" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="text" placeholder="Mumbai, MH" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <!-- Bio -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Company Bio</label>
                    <textarea placeholder="Describe your production house..." class="w-full h-24 bg-surface border border-border rounded-sm text-body text-textPrimary p-4 focus:outline-none focus:border-primary transition-colors resize-none"></textarea>
                </div>

            </div>

            <!-- Primary Action -->
            <button onclick="window.location.href='./H-2-CompanyVerification.html'" class="w-full h-[52px] bg-primary text-textOnPrimary rounded-md text-bodyBold flex items-center justify-center shadow-lg active:bg-primaryPressed transition-colors mt-auto mb-6">
                Next Step
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
