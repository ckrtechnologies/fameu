<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./H-4-CompanyProfile.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Edit Company</h3>
            <button class="px-3 py-1 text-primary text-bodyBold active:opacity-50">Save</button>
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar gap-6 mt-6">
            
            <!-- Logo Upload -->
            <div class="flex flex-col items-center justify-center gap-3">
                <div class="w-24 h-24 rounded-full bg-surface border border-border flex flex-col items-center justify-center relative overflow-hidden cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?auto=format&fit=crop&q=80&w=200&h=200" class="absolute inset-0 w-full h-full object-cover opacity-50">
                    <i data-lucide="camera" class="w-8 h-8 text-white z-10 drop-shadow-md mb-1"></i>
                    <span class="text-[10px] text-white font-semibold uppercase z-10 drop-shadow-md">Edit</span>
                </div>
            </div>

            <!-- Form -->
            <div class="flex flex-col gap-4">
                
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Company Name</label>
                    <input type="text" value="Dharma Productions" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Bio</label>
                    <textarea class="w-full h-24 bg-surface border border-border rounded-sm text-body text-textPrimary p-4 focus:outline-none focus:border-primary transition-colors resize-none">One of India's top film production and distribution companies, known for blockbuster hits in Hindi cinema.</textarea>
                </div>
                
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Website</label>
                    <div class="relative">
                        <i data-lucide="globe" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="url" value="https://www.dharmamovies.com" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Contact Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="email" value="casting@dharmamovies.com" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <div class="bg-infoBg/30 border border-info/30 p-3 rounded mt-2 flex items-start gap-2">
                    <i data-lucide="shield" class="w-4 h-4 text-info shrink-0 mt-0.5"></i>
                    <p class="text-[11px] text-textSecondary">Your legal entity details (GSTIN) cannot be changed here. Please contact support to update legal information.</p>
                </div>

            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
