<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Applicant Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[72px] mt-8 px-2 flex items-center justify-between shrink-0">
            <div class="flex items-center">
                <button onclick="window.location.href='./H-6-HiringDashboard.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>
                <h1 class="text-h3 font-semibold text-white ml-2">Applicant Review</h1>
            </div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto pb-24 flex flex-col hide-scrollbar">
            
            <!-- Profile Header -->
            <div class="px-4 flex items-center gap-4 mt-2 mb-6">
                <div class="w-20 h-20 rounded-full border border-border p-0.5">
                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&q=80&w=200&h=200" class="w-full h-full rounded-full object-cover">
                </div>
                <div>
                    <div class="flex items-center gap-1 mb-1">
                        <h2 class="text-h2 font-bold text-white">John Doe</h2>
                        <i data-lucide="badge-check" class="w-4 h-4 text-success fill-successBg"></i>
                    </div>
                    <p class="text-caption text-textSecondary mb-1">Actor • 25 yrs • Mumbai</p>
                    <div class="inline-flex items-center gap-1 bg-surfaceAlt px-2 py-1 rounded border border-border mt-1">
                        <i data-lucide="clock" class="w-3 h-3 text-textSecondary"></i>
                        <span class="text-[10px] text-textSecondary uppercase font-bold tracking-wider">Applied 2d ago</span>
                    </div>
                </div>
            </div>

            <!-- Cover Note -->
            <div class="px-4 mb-6">
                <div class="bg-surfaceAlt border border-border rounded-md p-4 relative">
                    <i data-lucide="quote" class="absolute top-2 right-2 w-6 h-6 text-border opacity-50"></i>
                    <p class="text-caption text-white italic">"Hi, I have 3 years of experience in theatre and have worked on similar thriller roles. I am available for the shoot dates."</p>
                </div>
            </div>

            <!-- Intro Video -->
            <div class="px-4 mb-6">
                <h3 class="text-h3 font-semibold text-white mb-3">Intro Video</h3>
                <div class="w-full aspect-video bg-surfaceAlt rounded-md border border-border overflow-hidden relative flex items-center justify-center cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1518151240476-8f20b30be347?auto=format&fit=crop&q=80&w=400&h=225" class="w-full h-full object-cover opacity-60">
                    <div class="absolute w-12 h-12 bg-primary/90 rounded-full flex items-center justify-center pl-1 backdrop-blur-sm shadow-lg">
                        <i data-lucide="play" class="w-6 h-6 text-textOnPrimary fill-textOnPrimary"></i>
                    </div>
                </div>
            </div>

            <!-- Portfolio Media -->
            <div class="px-4 mb-6">
                <h3 class="text-h3 font-semibold text-white mb-3">Portfolio Photos</h3>
                <div class="grid grid-cols-2 gap-2">
                    <div class="aspect-[4/5] bg-surfaceAlt rounded-md overflow-hidden relative border border-border">
                        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&q=80&w=300&h=400" class="w-full h-full object-cover">
                    </div>
                    <div class="aspect-[4/5] bg-surfaceAlt rounded-md overflow-hidden relative border border-border">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=300&h=400" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <!-- Physical Attributes -->
            <div class="px-4 mb-6">
                <h3 class="text-h3 font-semibold text-white mb-3">Attributes</h3>
                <div class="bg-surface border border-border rounded-md p-4 grid grid-cols-2 gap-4">
                    <div class="flex flex-col">
                        <span class="text-caption text-textSecondary">Height</span>
                        <span class="text-bodyBold text-white">175 cm</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-caption text-textSecondary">Weight</span>
                        <span class="text-bodyBold text-white">70 kg</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-caption text-textSecondary">Languages</span>
                        <span class="text-bodyBold text-white">Hindi, English</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Sticky Footer CTA (Action Bar) -->
        <div class="h-[80px] bg-surface border-t border-border px-4 py-3 shrink-0 flex items-center justify-between gap-3">
            <button onclick="alert('Applicant Rejected'); window.location.href='./H-6-HiringDashboard.html';" class="flex-1 h-[52px] bg-errorBg border border-error/50 text-error rounded-md text-bodyBold active:opacity-80 transition-colors">
                Reject
            </button>
            <button onclick="alert('Applicant Shortlisted! Chat Unlocked.'); window.location.href='./H-6-HiringDashboard.html';" class="flex-1 h-[52px] bg-primary text-textOnPrimary rounded-md text-bodyBold shadow-lg active:bg-primaryPressed transition-colors">
                Shortlist
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
