<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[56px] mt-12 px-2 flex items-center shrink-0">
            <button onclick="window.location.href='./HA-6-Forgot-Password.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col">
            
            <div class="mt-4 mb-8">
                <h1 class="text-h1 font-semibold text-white mb-2">Create New Password</h1>
                <p class="text-body text-textSecondary">Your new password must be different from previous used passwords.</p>
            </div>

            <!-- Form -->
            <div class="flex flex-col gap-4 mb-8">
                <!-- Input Group: OTP -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">6-Digit OTP</label>
                    <div class="relative">
                        <i data-lucide="key" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="text" placeholder="123456" maxlength="6" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <!-- Input Group: New Password -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">New Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="password" placeholder="Min. 8 characters" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-12 focus:outline-none focus:border-primary transition-colors">
                        <button class="absolute right-3 top-1/2 -translate-y-1/2 text-textSecondary active:text-primary">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Input Group: Confirm Password -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Confirm Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="password" placeholder="Min. 8 characters" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-12 focus:outline-none focus:border-primary transition-colors">
                        <button class="absolute right-3 top-1/2 -translate-y-1/2 text-textSecondary active:text-primary">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Primary Action -->
            <button onclick="window.location.href='./HA-5-Login.html'" class="w-full h-[52px] bg-primary text-textOnPrimary rounded-md text-bodyBold flex items-center justify-center shadow-lg active:bg-primaryPressed transition-colors mt-auto mb-6">
                Reset Password
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
