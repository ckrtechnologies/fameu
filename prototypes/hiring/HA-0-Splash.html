<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Splash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col items-center justify-center">
        
        <!-- Animated Logo Container -->
        <div class="flex flex-col items-center justify-center animate-pulse">
            <!-- Mock Logo Graphic -->
            <div class="w-24 h-24 rounded-full border-4 border-primary flex items-center justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#E3B04B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </div>
            
            <h1 class="text-display font-bold tracking-tight text-white">FAMEU</h1>
            <p class="text-primary text-overline mt-2 tracking-widest uppercase">Hiring</p>
        </div>

    </div>

    <script>
        // Auto navigate to onboarding after 2.5 seconds to simulate session check
        setTimeout(() => {
            window.location.href = './HA-1-Onboarding.html';
        }, 2500);
    </script>
</body>
</html>
