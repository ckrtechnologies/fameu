<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Hiring - Company Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[72px] mt-8 px-4 flex items-center justify-between shrink-0 bg-background z-10">
            <h1 class="text-h1 font-semibold text-white">Profile</h1>
            <button onclick="window.location.href='./H-5-EditCompanyProfile.html'" class="w-10 h-10 bg-surface border border-border rounded-full flex items-center justify-center relative active:bg-surfaceAlt">
                <i data-lucide="edit-3" class="w-4 h-4 text-white"></i>
            </button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto pb-24 flex flex-col bg-background relative hide-scrollbar">
            
            <!-- Hero Profile Section -->
            <div class="px-4 flex flex-col items-center mt-2 mb-6 text-center">
                <div class="w-24 h-24 rounded-full border border-border bg-surface flex items-center justify-center p-1 mb-4 relative">
                    <img src="https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?auto=format&fit=crop&q=80&w=200&h=200" class="w-full h-full rounded-full object-cover">
                    <!-- Verified Badge -->
                    <div class="absolute bottom-0 right-0 bg-background rounded-full border border-background">
                        <i data-lucide="shield-check" class="w-6 h-6 text-success fill-successBg"></i>
                    </div>
                </div>
                
                <h2 class="text-h2 font-bold text-white mb-1">Dharma Productions</h2>
                <p class="text-caption text-textSecondary mb-3">Production House • Mumbai</p>
                
                <div class="flex gap-4 mb-4">
                    <div class="flex flex-col items-center">
                        <span class="text-h3 font-bold text-white">45</span>
                        <span class="text-[10px] text-textSecondary uppercase tracking-wider">Posts</span>
                    </div>
                    <div class="w-[1px] h-8 bg-border"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-h3 font-bold text-white">12k</span>
                        <span class="text-[10px] text-textSecondary uppercase tracking-wider">Hired</span>
                    </div>
                </div>
                
                <p class="text-caption text-white opacity-80 leading-relaxed px-4">
                    One of India's top film production and distribution companies, known for blockbuster hits in Hindi cinema.
                </p>
            </div>

            <div class="w-full h-[1px] bg-border mb-6"></div>

            <!-- Stats/Tools Section -->
            <div class="px-4 mb-6">
                <h3 class="text-bodyBold text-white mb-4">Company Tools</h3>
                
                <div class="grid grid-cols-2 gap-3">
                    <button class="bg-surfaceAlt border border-border p-4 rounded-md text-left active:bg-border transition-colors">
                        <i data-lucide="users" class="w-6 h-6 text-primary mb-2"></i>
                        <span class="block text-caption font-semibold text-white">Team Members</span>
                        <span class="text-[10px] text-textSecondary">Manage access</span>
                    </button>
                    <button class="bg-surfaceAlt border border-border p-4 rounded-md text-left active:bg-border transition-colors">
                        <i data-lucide="credit-card" class="w-6 h-6 text-primary mb-2"></i>
                        <span class="block text-caption font-semibold text-white">Billing & Plans</span>
                        <span class="text-[10px] text-textSecondary">View invoices</span>
                    </button>
                </div>
            </div>
            
            <div class="px-4 mb-6">
                <div class="bg-surface border border-border rounded-md overflow-hidden mb-6">
                    <button class="w-full p-4 flex justify-between items-center bg-surface active:bg-surfaceAlt border-b border-border">
                        <div class="flex items-center gap-3">
                            <i data-lucide="bell" class="w-5 h-5 text-textSecondary"></i>
                            <span class="text-body text-white">Notification Preferences</span>
                        </div>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-textSecondary"></i>
                    </button>
                    <button class="w-full p-4 flex justify-between items-center bg-surface active:bg-surfaceAlt border-b border-border">
                        <div class="flex items-center gap-3">
                            <i data-lucide="help-circle" class="w-5 h-5 text-textSecondary"></i>
                            <span class="text-body text-white">Help Center</span>
                        </div>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-textSecondary"></i>
                    </button>
                    <button onclick="window.location.href='./HA-0-Splash.html'" class="w-full p-4 flex justify-between items-center bg-surface active:bg-surfaceAlt">
                        <div class="flex items-center gap-3">
                            <i data-lucide="log-out" class="w-5 h-5 text-error"></i>
                            <span class="text-body text-error">Log Out</span>
                        </div>
                    </button>
                </div>
            </div>

        </div>

        <!-- Bottom Tabs -->
        <div class="h-[80px] bg-surface border-t border-border px-6 flex justify-between items-center absolute bottom-0 w-full pb-4 pt-2">
            
            <button onclick="window.location.href='./H-6-HiringDashboard.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Dashboard</span>
            </button>

            <button class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="briefcase" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Auditions</span>
            </button>

            <button class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="users" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Talent</span>
            </button>

            <button class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="message-square" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Chat</span>
            </button>

            <button class="flex flex-col items-center gap-1 min-w-[56px] text-primary relative">
                <i data-lucide="user" class="w-6 h-6 fill-primary/20"></i>
                <span class="text-[10px] font-semibold">Profile</span>
            </button>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
