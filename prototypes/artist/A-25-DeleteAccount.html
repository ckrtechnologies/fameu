<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Delete Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./A-24-ArtistSettings.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Delete Account</h3>
            <div class="w-11"></div> <!-- spacer -->
        </div>

        <div class="flex-1 px-4 flex flex-col mt-8">
            
            <div class="w-16 h-16 bg-errorBg rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="alert-triangle" class="w-8 h-8 text-error"></i>
            </div>

            <h2 class="text-h2 font-bold text-white text-center mb-2">We're sorry to see you go</h2>
            <p class="text-body text-textSecondary text-center mb-8">Deleting your account is permanent. All your profile data, portfolio media, and application history will be permanently erased.</p>

            <div class="flex flex-col gap-1 mb-8">
                <label class="text-caption text-textSecondary font-semibold">Please tell us why you are leaving</label>
                <div class="relative">
                    <select class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 appearance-none focus:outline-none focus:border-error transition-colors">
                        <option>Not getting enough auditions</option>
                        <option>Privacy concerns</option>
                        <option>Found another platform</option>
                        <option>Taking a break</option>
                        <option>Other</option>
                    </select>
                    <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary pointer-events-none"></i>
                </div>
            </div>

            <!-- Confirm Textbox -->
            <div class="flex flex-col gap-1 mb-6">
                <label class="text-caption text-textSecondary font-semibold">Type "DELETE" to confirm</label>
                <input type="text" placeholder="DELETE" class="w-full h-[52px] bg-surface border border-error rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:ring-1 focus:ring-error transition-colors">
            </div>

            <button onclick="window.location.href='./AA-0-Splash.html'" class="w-full h-[52px] bg-error text-white rounded-md text-bodyBold shadow-lg active:opacity-80 transition-opacity mt-auto mb-4">
                Permanently Delete Account
            </button>
            <button onclick="window.location.href='./A-24-ArtistSettings.html'" class="w-full h-[52px] bg-transparent text-white rounded-md text-bodyBold active:bg-surface transition-colors mb-6">
                Cancel
            </button>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
