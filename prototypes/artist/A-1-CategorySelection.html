<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Category Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0">
            <button class="w-11 h-11 flex items-center justify-center text-textPrimary invisible">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Select Category</h3>
            <div class="w-11"></div> <!-- spacer -->
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar">
            
            <div class="mt-4 mb-6 text-center">
                <p class="text-body text-textSecondary">Choose your primary artistic field. You can add more skills later.</p>
            </div>

            <!-- Categories Grid -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                
                <!-- Active Category -->
                <button onclick="selectCategory(this, 'A-2-Actor-Registration.html')" class="category-card flex flex-col items-center justify-center p-6 bg-surfaceAlt border-2 border-primary rounded-md gap-3 active:opacity-80 transition-colors relative">
                    <div class="absolute top-2 right-2 text-primary">
                        <i data-lucide="check-circle-2" class="w-5 h-5 fill-primary text-surfaceAlt"></i>
                    </div>
                    <i data-lucide="masks-theater" class="w-8 h-8 text-primary"></i>
                    <span class="text-bodyBold text-white">Actor</span>
                </button>

                <!-- Inactive Categories -->
                <button onclick="selectCategory(this, 'A-3-Singer-Registration.html')" class="category-card flex flex-col items-center justify-center p-6 bg-surface border-2 border-transparent rounded-md gap-3 active:bg-surfaceAlt transition-colors">
                    <i data-lucide="mic-2" class="w-8 h-8 text-textSecondary"></i>
                    <span class="text-bodyBold text-textSecondary">Singer</span>
                </button>

                <button onclick="selectCategory(this, 'A-4-Model-Registration.html')" class="category-card flex flex-col items-center justify-center p-6 bg-surface border-2 border-transparent rounded-md gap-3 active:bg-surfaceAlt transition-colors">
                    <i data-lucide="camera" class="w-8 h-8 text-textSecondary"></i>
                    <span class="text-bodyBold text-textSecondary">Model</span>
                </button>

                <button onclick="selectCategory(this, 'A-5-Dancer-Registration.html')" class="category-card flex flex-col items-center justify-center p-6 bg-surface border-2 border-transparent rounded-md gap-3 active:bg-surfaceAlt transition-colors">
                    <i data-lucide="music-4" class="w-8 h-8 text-textSecondary"></i>
                    <span class="text-bodyBold text-textSecondary">Dancer</span>
                </button>

                <button onclick="selectCategory(this, 'A-6-Technician-Registration.html')" class="category-card flex flex-col items-center justify-center p-6 bg-surface border-2 border-transparent rounded-md gap-3 active:bg-surfaceAlt transition-colors">
                    <i data-lucide="wrench" class="w-8 h-8 text-textSecondary"></i>
                    <span class="text-bodyBold text-textSecondary">Technician</span>
                </button>

                <button onclick="selectCategory(this, '')" class="category-card flex flex-col items-center justify-center p-6 bg-surface border-2 border-transparent rounded-md gap-3 active:bg-surfaceAlt transition-colors">
                    <i data-lucide="megaphone" class="w-8 h-8 text-textSecondary"></i>
                    <span class="text-bodyBold text-textSecondary">Voice Artist</span>
                </button>

                <button onclick="selectCategory(this, '')" class="category-card flex flex-col items-center justify-center p-6 bg-surface border-2 border-transparent rounded-md gap-3 active:bg-surfaceAlt transition-colors">
                    <i data-lucide="pen-tool" class="w-8 h-8 text-textSecondary"></i>
                    <span class="text-bodyBold text-textSecondary">Writer</span>
                </button>

                <button onclick="selectCategory(this, '')" class="category-card flex flex-col items-center justify-center p-6 bg-surface border-2 border-transparent rounded-md gap-3 active:bg-surfaceAlt transition-colors">
                    <i data-lucide="clapperboard" class="w-8 h-8 text-textSecondary"></i>
                    <span class="text-bodyBold text-textSecondary">Director</span>
                </button>
            </div>

            <!-- Primary Action -->
            <button id="continue-btn" onclick="window.location.href='./A-2-Actor-Registration.html'" class="w-full h-[52px] bg-primary text-textOnPrimary rounded-md text-bodyBold flex items-center justify-center shadow-lg active:bg-primaryPressed transition-colors mt-auto mb-6">
                Continue
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();

        let nextTarget = './A-2-Actor-Registration.html';

        function selectCategory(el, targetUrl) {
            // Reset all
            document.querySelectorAll('.category-card').forEach(card => {
                card.className = "category-card flex flex-col items-center justify-center p-6 bg-surface border-2 border-transparent rounded-md gap-3 active:bg-surfaceAlt transition-colors";
                const icon = card.querySelector('i');
                const span = card.querySelector('span');
                icon.className = icon.className.replace('text-primary', 'text-textSecondary');
                span.className = span.className.replace('text-white', 'text-textSecondary');
                
                // Remove checkmark if exists
                const check = card.querySelector('.absolute');
                if(check) check.remove();
            });

            // Set active
            el.className = "category-card flex flex-col items-center justify-center p-6 bg-surfaceAlt border-2 border-primary rounded-md gap-3 active:opacity-80 transition-colors relative";
            const icon = el.querySelector('i');
            const span = el.querySelector('span');
            icon.className = icon.className.replace('text-textSecondary', 'text-primary');
            span.className = span.className.replace('text-textSecondary', 'text-white');
            
            // Add checkmark
            el.insertAdjacentHTML('afterbegin', `
                <div class="absolute top-2 right-2 text-primary">
                    <i data-lucide="check-circle-2" class="w-5 h-5 fill-primary text-surfaceAlt"></i>
                </div>
            `);
            lucide.createIcons();

            nextTarget = targetUrl;
        }

        document.getElementById('continue-btn').onclick = function() {
            if(nextTarget) {
                window.location.href = nextTarget;
            }
        };
    </script>
</body>
</html>
