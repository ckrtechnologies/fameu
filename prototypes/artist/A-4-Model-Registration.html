<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Model Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./A-1-CategorySelection.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Model Profile</h3>
            <button class="px-3 py-1 text-primary text-bodyBold active:opacity-50">Skip</button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar">
            
            <div class="mt-6 mb-6">
                <!-- Progress -->
                <div class="flex justify-between items-center mb-2">
                    <span class="text-caption text-textSecondary">Step 1 of 3: Basic Info</span>
                    <span class="text-caption font-semibold text-primary">33%</span>
                </div>
                <div class="w-full h-1 bg-surface rounded-full overflow-hidden">
                    <div class="w-1/3 h-full bg-primary"></div>
                </div>
            </div>

            <!-- Form -->
            <div class="flex flex-col gap-6 mb-8">
                
                <!-- Avatar Upload -->
                <div class="flex flex-col items-center justify-center gap-3">
                    <div class="w-24 h-24 rounded-full bg-surface border border-border flex flex-col items-center justify-center relative overflow-hidden cursor-pointer active:bg-surfaceAlt">
                        <i data-lucide="camera" class="w-8 h-8 text-textSecondary mb-1"></i>
                        <span class="text-[10px] text-textSecondary font-semibold uppercase">Upload</span>
                    </div>
                    <span class="text-caption text-textSecondary">Profile Photo</span>
                </div>

                <!-- Input Group: Full Name -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Full Name <span class="text-error">*</span></label>
                    <input type="text" placeholder="John Doe" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                </div>

                <!-- Row: Height & Weight -->
                <div class="flex gap-4">
                    <div class="flex flex-col gap-1 flex-1">
                        <label class="text-caption text-textSecondary font-semibold">Height (cm) <span class="text-error">*</span></label>
                        <input type="number" placeholder="180" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                    <div class="flex flex-col gap-1 flex-1">
                        <label class="text-caption text-textSecondary font-semibold">Weight (kg)</label>
                        <input type="number" placeholder="72" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <!-- Measurements (Chest-Waist-Hips) -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Measurements (Chest - Waist - Hips)</label>
                    <div class="flex gap-2">
                        <input type="number" placeholder="C" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors text-center">
                        <span class="flex items-center text-border">-</span>
                        <input type="number" placeholder="W" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors text-center">
                        <span class="flex items-center text-border">-</span>
                        <input type="number" placeholder="H" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors text-center">
                    </div>
                </div>

                <!-- Row: Shoe Size & Hair Color -->
                <div class="flex gap-4">
                    <div class="flex flex-col gap-1 flex-1">
                        <label class="text-caption text-textSecondary font-semibold">Shoe Size</label>
                        <input type="text" placeholder="UK 9" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                    <div class="flex flex-col gap-1 flex-1">
                        <label class="text-caption text-textSecondary font-semibold">Hair Color</label>
                        <input type="text" placeholder="Black" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <!-- Portfolio Photos (Grid Upload) -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Portfolio Photos (Min 3)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="aspect-[3/4] bg-surface border border-border border-dashed rounded-md flex flex-col items-center justify-center gap-1 cursor-pointer active:bg-surfaceAlt transition-colors">
                            <i data-lucide="plus" class="w-5 h-5 text-textSecondary"></i>
                        </div>
                        <div class="aspect-[3/4] bg-surface border border-border border-dashed rounded-md flex flex-col items-center justify-center gap-1 cursor-pointer active:bg-surfaceAlt transition-colors">
                            <i data-lucide="plus" class="w-5 h-5 text-textSecondary"></i>
                        </div>
                        <div class="aspect-[3/4] bg-surface border border-border border-dashed rounded-md flex flex-col items-center justify-center gap-1 cursor-pointer active:bg-surfaceAlt transition-colors">
                            <i data-lucide="plus" class="w-5 h-5 text-textSecondary"></i>
                        </div>
                    </div>
                </div>

                <!-- Experience Level -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Experience</label>
                    <div class="relative">
                        <select class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 appearance-none focus:outline-none focus:border-primary transition-colors">
                            <option>Fresher</option>
                            <option>1-3 Years</option>
                            <option>3+ Years</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary pointer-events-none"></i>
                    </div>
                </div>

            </div>

            <!-- Primary Action -->
            <button onclick="window.location.href='./A-7-HomeDashboard.html'" class="w-full h-[52px] bg-primary text-textOnPrimary rounded-md text-bodyBold flex items-center justify-center shadow-lg active:bg-primaryPressed transition-colors mt-auto mb-6">
                Next Step
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
