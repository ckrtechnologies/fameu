<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Filters</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header (Modal style) -->
        <div class="h-[56px] mt-12 px-4 flex items-center justify-between shrink-0 border-b border-border">
            <h3 class="text-h3 font-semibold text-white">Filters</h3>
            <button onclick="window.location.href='./A-14-AuditionDiscovery.html'" class="w-8 h-8 flex items-center justify-center bg-surfaceAlt rounded-full text-textSecondary active:bg-surface">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar gap-8 pt-6">
            
            <!-- Category -->
            <div class="flex flex-col gap-3">
                <h4 class="text-bodyBold text-white">Category</h4>
                <div class="flex flex-wrap gap-2">
                    <button class="px-4 py-2 bg-primary/20 border border-primary text-primary rounded-full text-caption font-semibold">Actor</button>
                    <button class="px-4 py-2 bg-surface border border-border text-textSecondary rounded-full text-caption font-semibold">Model</button>
                    <button class="px-4 py-2 bg-surface border border-border text-textSecondary rounded-full text-caption font-semibold">Singer</button>
                    <button class="px-4 py-2 bg-surface border border-border text-textSecondary rounded-full text-caption font-semibold">Dancer</button>
                </div>
            </div>

            <!-- Location -->
            <div class="flex flex-col gap-3">
                <h4 class="text-bodyBold text-white">Location</h4>
                <div class="relative">
                    <i data-lucide="map-pin" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                    <input type="text" placeholder="Mumbai, MH" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-12 pr-4 focus:outline-none focus:border-primary transition-colors">
                </div>
            </div>

            <!-- Gender -->
            <div class="flex flex-col gap-3">
                <h4 class="text-bodyBold text-white">Role Gender</h4>
                <div class="flex flex-wrap gap-2">
                    <button class="px-4 py-2 bg-surface border border-border text-textSecondary rounded-full text-caption font-semibold">Male</button>
                    <button class="px-4 py-2 bg-surface border border-border text-textSecondary rounded-full text-caption font-semibold">Female</button>
                    <button class="px-4 py-2 bg-primary/20 border border-primary text-primary rounded-full text-caption font-semibold">Any</button>
                </div>
            </div>

            <!-- Age Range -->
            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <h4 class="text-bodyBold text-white">Age Range</h4>
                    <span class="text-caption text-textSecondary">18 - 35</span>
                </div>
                <!-- Mock Slider -->
                <div class="w-full h-1 bg-surfaceAlt rounded-full relative mt-2">
                    <div class="absolute left-[18%] right-[65%] h-full bg-primary rounded-full"></div>
                    <div class="w-5 h-5 bg-white rounded-full absolute top-1/2 -translate-y-1/2 left-[18%] shadow-md border-2 border-primary -translate-x-1/2"></div>
                    <div class="w-5 h-5 bg-white rounded-full absolute top-1/2 -translate-y-1/2 right-[65%] shadow-md border-2 border-primary translate-x-1/2"></div>
                </div>
            </div>

            <!-- Audition Type -->
            <div class="flex flex-col gap-3">
                <h4 class="text-bodyBold text-white">Audition Type</h4>
                <div class="flex flex-col gap-2">
                    <label class="flex items-center justify-between p-3 bg-surface border border-border rounded-sm">
                        <span class="text-body text-white">Online Application</span>
                        <div class="w-5 h-5 rounded border border-primary bg-primary/20 flex items-center justify-center">
                            <i data-lucide="check" class="w-3 h-3 text-primary"></i>
                        </div>
                    </label>
                    <label class="flex items-center justify-between p-3 bg-surface border border-border rounded-sm">
                        <span class="text-body text-textSecondary">Walk-In (In-person)</span>
                        <div class="w-5 h-5 rounded border border-border"></div>
                    </label>
                </div>
            </div>

        </div>

        <!-- Sticky Footer CTA -->
        <div class="h-[80px] bg-surface border-t border-border px-4 py-3 shrink-0 flex items-center justify-between gap-3">
            <button class="flex-1 h-[52px] bg-surfaceAlt text-white rounded-md text-bodyBold active:opacity-80 transition-colors">
                Reset
            </button>
            <button onclick="window.location.href='./A-14-AuditionDiscovery.html'" class="flex-[2] h-[52px] bg-primary text-textOnPrimary rounded-md text-bodyBold shadow-lg active:bg-primaryPressed transition-colors">
                Show 45 Results
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
