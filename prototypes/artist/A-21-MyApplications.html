<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - My Applications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[72px] mt-8 px-4 flex items-center justify-between shrink-0 border-b border-border bg-background z-10">
            <h1 class="text-h1 font-semibold text-white">Applications</h1>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto pb-24 flex flex-col bg-background relative hide-scrollbar">
            
            <!-- Tabs -->
            <div class="flex border-b border-border sticky top-0 bg-background/90 backdrop-blur-md z-10">
                <button id="tab-active" onclick="switchTab('active')" class="flex-1 py-3 text-bodyBold text-primary border-b-2 border-primary transition-colors">Active</button>
                <button id="tab-past" onclick="switchTab('past')" class="flex-1 py-3 text-bodyBold text-textSecondary border-b-2 border-transparent active:bg-surfaceAlt transition-colors">Past</button>
                <button id="tab-saved" onclick="switchTab('saved')" class="flex-1 py-3 text-bodyBold text-textSecondary border-b-2 border-transparent active:bg-surfaceAlt transition-colors">Saved</button>
            </div>

            <!-- Active List -->
            <div id="list-active" class="px-4 flex flex-col gap-4 py-4">
                <!-- Application Card 1 -->
                <div onclick="window.location.href='./A-22-ApplicationDetail.html'" class="bg-surface border border-border rounded-md overflow-hidden cursor-pointer active:bg-surfaceAlt transition-colors">
                    <div class="p-4 flex gap-3">
                        <img src="https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&q=80&w=100&h=140" class="w-16 h-16 object-cover rounded border border-border">
                        <div class="flex-1">
                            <h3 class="text-bodyBold text-white leading-tight mb-1">Lead Role - Prime Series</h3>
                            <div class="flex items-center gap-1 mb-2">
                                <span class="text-caption text-textSecondary">Dharma Prod.</span>
                            </div>
                            <div class="flex gap-2 text-caption text-textSecondary">
                                <div class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> Mumbai</div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-surfaceAlt px-4 py-3 flex items-center justify-between border-t border-border">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
                            <span class="text-caption font-semibold text-primary">Pending Review</span>
                        </div>
                        <span class="text-caption text-textSecondary">Applied 2d ago</span>
                    </div>
                </div>

                <!-- Application Card 2 -->
                <div onclick="window.location.href='./A-22-ApplicationDetail.html'" class="bg-surface border border-border rounded-md overflow-hidden cursor-pointer active:bg-surfaceAlt transition-colors">
                    <div class="p-4 flex gap-3">
                        <div class="w-16 h-16 bg-surfaceAlt border border-border rounded flex items-center justify-center text-textSecondary">
                            <i data-lucide="camera" class="w-6 h-6"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-bodyBold text-white leading-tight mb-1">TVC for Major FMCG</h3>
                            <div class="flex items-center gap-1 mb-2">
                                <span class="text-caption text-textSecondary">Red Chillies</span>
                            </div>
                            <div class="flex gap-2 text-caption text-textSecondary">
                                <div class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> Delhi</div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-surfaceAlt px-4 py-3 flex items-center justify-between border-t border-border">
                        <div class="flex items-center gap-2">
                            <i data-lucide="check-circle-2" class="w-4 h-4 text-success"></i>
                            <span class="text-caption font-semibold text-success">Shortlisted</span>
                        </div>
                        <button class="bg-primary px-3 py-1 rounded text-[10px] font-bold text-textOnPrimary">View Chat</button>
                    </div>
                </div>
            </div>

            <!-- Past List -->
            <div id="list-past" class="px-4 flex flex-col gap-4 py-4 hidden">
                <!-- Application Card 3 -->
                <div onclick="window.location.href='./A-22-ApplicationDetail.html'" class="bg-surface border border-border rounded-md overflow-hidden cursor-pointer active:bg-surfaceAlt transition-colors opacity-70">
                    <div class="p-4 flex gap-3">
                        <div class="w-16 h-16 bg-surfaceAlt border border-border rounded flex items-center justify-center text-textSecondary">
                            <i data-lucide="video" class="w-6 h-6"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-bodyBold text-white leading-tight mb-1">Music Video Extras</h3>
                            <div class="flex items-center gap-1 mb-2">
                                <span class="text-caption text-textSecondary">T-Series</span>
                            </div>
                            <div class="flex gap-2 text-caption text-textSecondary">
                                <div class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> Pune</div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-surfaceAlt px-4 py-3 flex items-center justify-between border-t border-border">
                        <div class="flex items-center gap-2">
                            <i data-lucide="x-circle" class="w-4 h-4 text-textSecondary"></i>
                            <span class="text-caption font-semibold text-textSecondary">Not Selected</span>
                        </div>
                        <span class="text-caption text-textSecondary">1w ago</span>
                    </div>
                </div>
            </div>

            <!-- Saved List -->
            <div id="list-saved" class="px-4 flex flex-col gap-4 py-4 hidden">
                <!-- Application Card 4 -->
                <div onclick="window.location.href='./A-19-AuditionDetail.html'" class="bg-surface border border-border rounded-md overflow-hidden cursor-pointer active:bg-surfaceAlt transition-colors">
                    <div class="p-4 flex gap-3">
                        <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&q=80&w=100&h=140" class="w-16 h-16 object-cover rounded border border-border">
                        <div class="flex-1">
                            <h3 class="text-bodyBold text-white leading-tight mb-1">Netflix Original Series - Supporting</h3>
                            <div class="flex items-center gap-1 mb-2">
                                <span class="text-caption text-textSecondary">Balaji Telefilms</span>
                            </div>
                            <div class="flex gap-2 text-caption text-textSecondary">
                                <div class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> Mumbai</div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-surfaceAlt px-4 py-3 flex items-center justify-between border-t border-border">
                        <div class="flex items-center gap-2">
                            <i data-lucide="bookmark" class="w-4 h-4 text-primary fill-primary"></i>
                            <span class="text-caption font-semibold text-primary">Saved</span>
                        </div>
                        <button class="bg-primary px-3 py-1 rounded text-[10px] font-bold text-textOnPrimary">Apply Now</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Tabs -->
        <div class="h-[80px] bg-surface border-t border-border px-6 flex justify-between items-center absolute bottom-0 w-full pb-4 pt-2">
            
            <button onclick="window.location.href='./A-7-HomeDashboard.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Home</span>
            </button>

            <button onclick="window.location.href='./A-14-AuditionDiscovery.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="search" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Search</span>
            </button>

            <button class="flex flex-col items-center gap-1 min-w-[56px] text-primary">
                <i data-lucide="briefcase" class="w-6 h-6 fill-primary/20"></i>
                <span class="text-[10px] font-semibold">Applied</span>
            </button>

            <button onclick="window.location.href='./A-26-ChatList.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors relative">
                <i data-lucide="message-square" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Chat</span>
            </button>

            <button onclick="window.location.href='./A-8-ArtistProfile.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Profile</span>
            </button>

        </div>

    </div>

    <script>
        lucide.createIcons();

        function switchTab(tabName) {
            // Reset all tabs
            document.querySelectorAll('button[id^="tab-"]').forEach(btn => {
                btn.classList.remove('text-primary', 'border-primary');
                btn.classList.add('text-textSecondary', 'border-transparent');
            });
            
            // Set active tab
            const activeBtn = document.getElementById('tab-' + tabName);
            activeBtn.classList.remove('text-textSecondary', 'border-transparent');
            activeBtn.classList.add('text-primary', 'border-primary');

            // Hide all lists
            document.querySelectorAll('div[id^="list-"]').forEach(list => {
                list.classList.add('hidden');
            });

            // Show active list
            document.getElementById('list-' + tabName).classList.remove('hidden');
        }
    </script>
</body>
</html>
