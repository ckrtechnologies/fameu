<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Audition Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[120px] mt-8 px-4 flex flex-col justify-center shrink-0 border-b border-border bg-surface/50 backdrop-blur-md relative z-10">
            <div class="flex items-center justify-between mb-3">
                <h1 class="text-h1 font-semibold text-white">Search</h1>
                <button onclick="window.location.href='./A-15-AuditionFilter.html'" class="w-10 h-10 bg-surfaceAlt border border-border rounded-full flex items-center justify-center active:bg-surface transition-colors">
                    <i data-lucide="sliders-horizontal" class="w-5 h-5 text-textPrimary"></i>
                </button>
            </div>
            
            <!-- Search Bar -->
            <div class="relative w-full">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                <input type="text" placeholder="Search roles, houses, or locations..." class="w-full h-10 bg-surface border border-border rounded-full text-body text-textPrimary pl-10 pr-4 focus:outline-none focus:border-primary transition-colors">
            </div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto pb-24 flex flex-col bg-background">
            
            <!-- Filter Chips -->
            <div class="flex gap-2 overflow-x-auto hide-scrollbar px-4 py-4">
                <button class="shrink-0 h-8 px-4 bg-primary text-textOnPrimary rounded-full text-caption font-semibold">All</button>
                <button class="shrink-0 h-8 px-4 bg-surface border border-border text-textPrimary rounded-full text-caption font-semibold active:bg-surfaceAlt">Actor</button>
                <button class="shrink-0 h-8 px-4 bg-surface border border-border text-textPrimary rounded-full text-caption font-semibold active:bg-surfaceAlt">Mumbai</button>
                <button class="shrink-0 h-8 px-4 bg-surface border border-border text-textPrimary rounded-full text-caption font-semibold active:bg-surfaceAlt">Walk-in</button>
                <button class="shrink-0 h-8 px-4 bg-surface border border-border text-textPrimary rounded-full text-caption font-semibold active:bg-surfaceAlt">High Pay</button>
            </div>

            <!-- List -->
            <div class="px-4 flex flex-col gap-3 pb-4">
                
                <!-- List Item 1 -->
                <div onclick="window.location.href='./A-19-AuditionDetail.html'" class="bg-surface border border-border rounded-md p-3 flex gap-3 active:bg-surfaceAlt transition-colors cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&q=80&w=100&h=140" class="w-[80px] h-[110px] object-cover rounded-sm">
                    <div class="flex-1 py-1">
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[10px] font-bold text-white bg-surfaceAlt px-2 py-0.5 rounded border border-border uppercase tracking-wider">Scheduled</span>
                            <i data-lucide="bookmark" class="w-4 h-4 text-textSecondary"></i>
                        </div>
                        <h3 class="text-bodyBold text-white leading-tight mb-1">Lead Role - Prime Series</h3>
                        <div class="flex items-center gap-1 mb-2">
                            <span class="text-caption text-textSecondary truncate">Dharma Prod.</span>
                            <i data-lucide="badge-check" class="w-3 h-3 text-success fill-successBg shrink-0"></i>
                        </div>
                        <div class="flex gap-3 text-caption text-textSecondary">
                            <div class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> Mumbai</div>
                            <div class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> 15 Aug</div>
                        </div>
                    </div>
                </div>

                <!-- List Item 2 -->
                <div class="bg-surface border border-border rounded-md p-3 flex gap-3 active:bg-surfaceAlt transition-colors cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&q=80&w=100&h=140" class="w-[80px] h-[110px] object-cover rounded-sm">
                    <div class="flex-1 py-1">
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[10px] font-bold text-textOnPrimary bg-primary/90 px-2 py-0.5 rounded border border-primary uppercase tracking-wider">Walk-in</span>
                            <i data-lucide="bookmark" class="w-4 h-4 text-textSecondary"></i>
                        </div>
                        <h3 class="text-bodyBold text-white leading-tight mb-1">TVC for Major FMCG</h3>
                        <div class="flex items-center gap-1 mb-2">
                            <span class="text-caption text-textSecondary truncate">Red Chillies</span>
                            <i data-lucide="badge-check" class="w-3 h-3 text-success fill-successBg shrink-0"></i>
                        </div>
                        <div class="flex gap-3 text-caption text-textSecondary">
                            <div class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> Delhi</div>
                            <div class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> Today</div>
                        </div>
                    </div>
                </div>

                <!-- List Item 3 -->
                <div class="bg-surface border border-border rounded-md p-3 flex gap-3 active:bg-surfaceAlt transition-colors cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1514306191717-452ec28c7814?auto=format&fit=crop&q=80&w=100&h=140" class="w-[80px] h-[110px] object-cover rounded-sm">
                    <div class="flex-1 py-1">
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[10px] font-bold text-white bg-surfaceAlt px-2 py-0.5 rounded border border-border uppercase tracking-wider">Scheduled</span>
                            <i data-lucide="bookmark" class="w-4 h-4 text-textSecondary"></i>
                        </div>
                        <h3 class="text-bodyBold text-white leading-tight mb-1">Music Video Dancer</h3>
                        <div class="flex items-center gap-1 mb-2">
                            <span class="text-caption text-textSecondary truncate">T-Series</span>
                            <i data-lucide="badge-check" class="w-3 h-3 text-success fill-successBg shrink-0"></i>
                        </div>
                        <div class="flex gap-3 text-caption text-textSecondary">
                            <div class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> Pune</div>
                            <div class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> 20 Aug</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bottom Tabs -->
        <div class="h-[80px] bg-surface border-t border-border px-6 flex justify-between items-center absolute bottom-0 w-full pb-4 pt-2">
            
            <button onclick="window.location.href='./A-7-HomeDashboard.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Home</span>
            </button>

            <button class="flex flex-col items-center gap-1 min-w-[56px] text-primary">
                <i data-lucide="search" class="w-6 h-6 fill-primary/20"></i>
                <span class="text-[10px] font-semibold">Search</span>
            </button>

            <button onclick="window.location.href='./A-21-MyApplications.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="briefcase" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Applied</span>
            </button>

            <button onclick="window.location.href='./A-26-ChatList.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors relative">
                <i data-lucide="message-square" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Chat</span>
            </button>

            <button onclick="window.location.href='./A-8-ArtistProfile.html'" class="flex flex-col items-center gap-1 min-w-[56px] text-textSecondary active:text-primary transition-colors">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Profile</span>
            </button>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
