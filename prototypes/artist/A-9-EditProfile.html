<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./A-8-ArtistProfile.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Edit Profile</h3>
            <button class="px-3 py-1 text-primary text-bodyBold active:opacity-50">Save</button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar gap-6 mt-6">
            
            <!-- Avatar Upload -->
            <div class="flex flex-col items-center justify-center gap-3">
                <div class="w-24 h-24 rounded-full bg-surface border border-border flex flex-col items-center justify-center relative overflow-hidden cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&q=80&w=200&h=200" class="absolute inset-0 w-full h-full object-cover opacity-50">
                    <i data-lucide="camera" class="w-8 h-8 text-white z-10 drop-shadow-md mb-1"></i>
                    <span class="text-[10px] text-white font-semibold uppercase z-10 drop-shadow-md">Edit</span>
                </div>
            </div>

            <!-- Form -->
            <div class="flex flex-col gap-4">
                
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Full Name</label>
                    <input type="text" value="John Doe" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Bio</label>
                    <textarea class="w-full h-24 bg-surface border border-border rounded-sm text-body text-textPrimary p-4 focus:outline-none focus:border-primary transition-colors resize-none">Method actor with 3 years of theatre experience in Mumbai. Specialized in intense dramatic roles.</textarea>
                </div>

                <div class="flex gap-4">
                    <div class="flex flex-col gap-1 flex-1">
                        <label class="text-caption text-textSecondary font-semibold">City</label>
                        <input type="text" value="Mumbai" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                    <div class="flex flex-col gap-1 flex-1">
                        <label class="text-caption text-textSecondary font-semibold">Age</label>
                        <input type="number" value="25" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

                <!-- Attributes Link -->
                <button class="w-full h-[52px] bg-surface border border-border rounded-sm flex items-center justify-between px-4 mt-2 active:bg-surfaceAlt">
                    <span class="text-body text-white">Edit Physical Attributes</span>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-textSecondary"></i>
                </button>
                
                <button class="w-full h-[52px] bg-surface border border-border rounded-sm flex items-center justify-between px-4 active:bg-surfaceAlt">
                    <span class="text-body text-white">Manage Skills & Languages</span>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-textSecondary"></i>
                </button>

            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
