<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./A-8-ArtistProfile.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Resume</h3>
            <div class="w-11"></div> <!-- spacer -->
        </div>

        <div class="flex-1 p-4 flex flex-col">
            
            <p class="text-body text-textSecondary mb-6 mt-4">Upload your professional CV detailing your past projects, education, and credentials.</p>

            <!-- Current File -->
            <div class="bg-surface border border-primary/30 rounded-md p-4 flex items-center gap-4 mb-6">
                <div class="w-12 h-12 bg-primary/10 rounded flex items-center justify-center shrink-0">
                    <i data-lucide="file-text" class="w-6 h-6 text-primary"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 class="text-bodyBold text-white truncate">John_Doe_Acting_CV.pdf</h4>
                    <span class="text-caption text-textSecondary">1.2 MB • Uploaded Jan 12</span>
                </div>
                <button class="text-primary p-2">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Upload Area -->
            <div class="w-full h-[140px] bg-surfaceAlt border border-border border-dashed rounded-md flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-surface transition-colors">
                <i data-lucide="upload-cloud" class="w-8 h-8 text-textSecondary"></i>
                <div class="text-center">
                    <p class="text-bodyBold text-white">Replace File</p>
                    <p class="text-[11px] text-textSecondary">PDF or DOCX (Max 5MB)</p>
                </div>
            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
