<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[72px] mt-8 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <div class="flex items-center">
                <button onclick="window.location.href='./A-14-AuditionDiscovery.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-2 ml-1">
                    <h1 class="text-h2 font-semibold text-white">Upcoming</h1>
                </div>
            </div>
            <button class="w-11 h-11 flex items-center justify-center text-primary">
                <i data-lucide="calendar" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar mt-4">
            
            <!-- Month Selector (Mock) -->
            <div class="flex items-center justify-between mb-6">
                <button class="p-2 text-textSecondary"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                <h3 class="text-bodyBold text-white">October 2023</h3>
                <button class="p-2 text-white"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
            </div>

            <!-- Date Scroller -->
            <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 mb-6 -mx-4 px-4 snap-x">
                <div class="w-[52px] h-[70px] bg-surface border border-border rounded-lg flex flex-col items-center justify-center shrink-0 snap-start">
                    <span class="text-caption text-textSecondary">Mon</span>
                    <span class="text-bodyBold text-white">12</span>
                </div>
                <div class="w-[52px] h-[70px] bg-primary rounded-lg flex flex-col items-center justify-center shrink-0 shadow-[0_4px_12px_rgba(227,176,75,0.3)] snap-start relative">
                    <span class="text-caption text-background">Tue</span>
                    <span class="text-bodyBold text-background">13</span>
                    <div class="absolute -bottom-1 w-1.5 h-1.5 bg-white rounded-full"></div>
                </div>
                <div class="w-[52px] h-[70px] bg-surface border border-border rounded-lg flex flex-col items-center justify-center shrink-0 snap-start relative">
                    <span class="text-caption text-textSecondary">Wed</span>
                    <span class="text-bodyBold text-white">14</span>
                    <div class="absolute -bottom-1 w-1.5 h-1.5 bg-primary rounded-full"></div>
                </div>
                <div class="w-[52px] h-[70px] bg-surface border border-border rounded-lg flex flex-col items-center justify-center shrink-0 snap-start">
                    <span class="text-caption text-textSecondary">Thu</span>
                    <span class="text-bodyBold text-white">15</span>
                </div>
                <div class="w-[52px] h-[70px] bg-surface border border-border rounded-lg flex flex-col items-center justify-center shrink-0 snap-start">
                    <span class="text-caption text-textSecondary">Fri</span>
                    <span class="text-bodyBold text-white">16</span>
                </div>
            </div>

            <h3 class="text-bodyBold text-white mb-4">Tue, Oct 13 Events</h3>

            <div class="flex flex-col gap-4">
                
                <!-- Event 1 -->
                <div class="bg-surfaceAlt border border-border rounded-md p-4 flex gap-4">
                    <div class="flex flex-col items-center w-12 shrink-0">
                        <span class="text-caption text-textSecondary">10:00</span>
                        <span class="text-[10px] text-textSecondary">AM</span>
                    </div>
                    <div class="w-1 bg-primary rounded-full"></div>
                    <div class="flex-1">
                        <span class="text-[10px] font-bold text-primary tracking-wider uppercase mb-1 block">Scheduled Interview</span>
                        <h4 class="text-bodyBold text-white leading-tight mb-1">Dharma Prod. Callback</h4>
                        <p class="text-caption text-textSecondary flex items-center gap-1 mt-2">
                            <i data-lucide="map-pin" class="w-3 h-3"></i> Andheri West Studio
                        </p>
                    </div>
                </div>

                <!-- Event 2 -->
                <div class="bg-surface border border-border rounded-md p-4 flex gap-4">
                    <div class="flex flex-col items-center w-12 shrink-0">
                        <span class="text-caption text-textSecondary">02:30</span>
                        <span class="text-[10px] text-textSecondary">PM</span>
                    </div>
                    <div class="w-1 bg-border rounded-full"></div>
                    <div class="flex-1">
                        <span class="text-[10px] font-bold text-textSecondary tracking-wider uppercase mb-1 block">Walk-in Deadline</span>
                        <h4 class="text-bodyBold text-white leading-tight mb-1">TVC Extras Casting</h4>
                        <p class="text-caption text-textSecondary flex items-center gap-1 mt-2">
                            <i data-lucide="clock" class="w-3 h-3"></i> Ends at 5 PM
                        </p>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
