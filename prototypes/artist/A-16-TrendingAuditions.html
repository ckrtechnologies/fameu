<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Trending</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[72px] mt-8 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <div class="flex items-center">
                <button onclick="window.location.href='./A-7-HomeDashboard.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-2 ml-1">
                    <h1 class="text-h2 font-semibold text-white">Trending Now</h1>
                    <i data-lucide="flame" class="w-5 h-5 text-error fill-error"></i>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar gap-4 mt-4">
            
            <!-- Trending Item 1 -->
            <div onclick="window.location.href='./A-19-AuditionDetail.html'" class="w-full h-[220px] bg-surface rounded-md border border-border overflow-hidden relative cursor-pointer active:opacity-90">
                <img src="https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&q=80&w=600&h=400" class="absolute inset-0 w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                
                <div class="absolute top-3 left-3 bg-error/90 px-2 py-1 rounded flex items-center gap-1 backdrop-blur-sm">
                    <i data-lucide="flame" class="w-3 h-3 text-white"></i>
                    <span class="text-[10px] font-bold text-white tracking-wide uppercase">#1 Hot</span>
                </div>
                
                <div class="absolute bottom-4 left-4 right-4">
                    <h3 class="text-h2 font-bold text-white leading-tight mb-1">Lead Actor - Crime Thriller</h3>
                    <p class="text-caption text-white/80 mb-2">Netflix Original Series • Mumbai</p>
                    <div class="flex justify-between items-center">
                        <div class="flex gap-2">
                            <span class="bg-black/50 backdrop-blur text-white text-[10px] px-2 py-1 rounded border border-white/20">Male, 25-35</span>
                            <span class="bg-black/50 backdrop-blur text-white text-[10px] px-2 py-1 rounded border border-white/20">Closes in 2d</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trending Item 2 -->
            <div class="w-full h-[220px] bg-surface rounded-md border border-border overflow-hidden relative cursor-pointer active:opacity-90">
                <img src="https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?auto=format&fit=crop&q=80&w=600&h=400" class="absolute inset-0 w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                
                <div class="absolute top-3 left-3 bg-black/60 px-2 py-1 rounded flex items-center gap-1 backdrop-blur-sm border border-border">
                    <span class="text-[10px] font-bold text-white tracking-wide uppercase">#2 Trending</span>
                </div>
                
                <div class="absolute bottom-4 left-4 right-4">
                    <h3 class="text-h2 font-bold text-white leading-tight mb-1">Dancers for Music Video</h3>
                    <p class="text-caption text-white/80 mb-2">T-Series • Delhi / NCR</p>
                    <div class="flex justify-between items-center">
                        <div class="flex gap-2">
                            <span class="bg-black/50 backdrop-blur text-white text-[10px] px-2 py-1 rounded border border-white/20">Hip-Hop</span>
                            <span class="bg-black/50 backdrop-blur text-primary text-[10px] font-bold px-2 py-1 rounded border border-primary/50">Walk-in Tomorrow</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trending Item 3 -->
            <div class="w-full h-[220px] bg-surface rounded-md border border-border overflow-hidden relative cursor-pointer active:opacity-90">
                <div class="absolute inset-0 bg-surfaceAlt flex items-center justify-center">
                    <i data-lucide="image" class="w-10 h-10 text-border"></i>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                
                <div class="absolute top-3 left-3 bg-black/60 px-2 py-1 rounded flex items-center gap-1 backdrop-blur-sm border border-border">
                    <span class="text-[10px] font-bold text-white tracking-wide uppercase">#3 Trending</span>
                </div>
                
                <div class="absolute bottom-4 left-4 right-4">
                    <h3 class="text-h2 font-bold text-white leading-tight mb-1">Female Model for Print Ad</h3>
                    <p class="text-caption text-white/80 mb-2">Myntra • Bangalore</p>
                    <div class="flex justify-between items-center">
                        <div class="flex gap-2">
                            <span class="bg-black/50 backdrop-blur text-white text-[10px] px-2 py-1 rounded border border-white/20">Female, 18-25</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
