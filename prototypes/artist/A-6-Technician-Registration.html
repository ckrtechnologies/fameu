<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Technician Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <!-- Header -->
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./A-1-CategorySelection.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Technician Profile</h3>
            <button class="px-3 py-1 text-primary text-bodyBold active:opacity-50">Skip</button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col hide-scrollbar">
            
            <div class="mt-6 mb-6">
                <!-- Progress -->
                <div class="flex justify-between items-center mb-2">
                    <span class="text-caption text-textSecondary">Step 1 of 3: Basic Info</span>
                    <span class="text-caption font-semibold text-primary">33%</span>
                </div>
                <div class="w-full h-1 bg-surface rounded-full overflow-hidden">
                    <div class="w-1/3 h-full bg-primary"></div>
                </div>
            </div>

            <!-- Form -->
            <div class="flex flex-col gap-6 mb-8">
                
                <!-- Subcategory -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Specialization <span class="text-error">*</span></label>
                    <div class="relative">
                        <select class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 appearance-none focus:outline-none focus:border-primary transition-colors">
                            <option>Video Editor</option>
                            <option>Cinematographer</option>
                            <option>Makeup Artist</option>
                            <option>Sound Engineer</option>
                            <option>VFX Artist</option>
                            <option>Fashion Stylist</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary pointer-events-none"></i>
                    </div>
                </div>

                <!-- Input Group: Full Name -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Full Name <span class="text-error">*</span></label>
                    <input type="text" placeholder="John Doe" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 focus:outline-none focus:border-primary transition-colors">
                </div>

                <!-- Experience Level -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Experience Level</label>
                    <div class="relative">
                        <select class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary px-4 appearance-none focus:outline-none focus:border-primary transition-colors">
                            <option>Junior (0-2 Yrs)</option>
                            <option>Mid (3-5 Yrs)</option>
                            <option>Senior (5+ Yrs)</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary pointer-events-none"></i>
                    </div>
                </div>

                <!-- Software / Equipment -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Equipment / Software Used</label>
                    <div class="w-full min-h-[52px] p-2 bg-surface border border-border rounded-sm flex flex-wrap gap-2 items-center">
                        <div class="bg-surfaceAlt px-3 py-1 rounded-full flex items-center gap-1 border border-border">
                            <span class="text-caption text-white">Premiere Pro</span>
                            <i data-lucide="x" class="w-3 h-3 text-textSecondary cursor-pointer hover:text-white"></i>
                        </div>
                        <div class="bg-surfaceAlt px-3 py-1 rounded-full flex items-center gap-1 border border-border">
                            <span class="text-caption text-white">DaVinci Resolve</span>
                            <i data-lucide="x" class="w-3 h-3 text-textSecondary cursor-pointer hover:text-white"></i>
                        </div>
                        <input type="text" placeholder="Add tool..." class="bg-transparent border-none outline-none text-body text-textPrimary flex-1 min-w-[100px]">
                    </div>
                </div>

                <!-- Resume Upload -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Resume / CV</label>
                    <div class="w-full h-[80px] bg-surface border border-border border-dashed rounded-md flex flex-col items-center justify-center gap-1 cursor-pointer active:bg-surfaceAlt transition-colors">
                        <i data-lucide="file-text" class="w-5 h-5 text-textSecondary"></i>
                        <span class="text-caption text-textSecondary font-semibold">Upload PDF (Max 5MB)</span>
                    </div>
                </div>

                <!-- Link to Work -->
                <div class="flex flex-col gap-1">
                    <label class="text-caption text-textSecondary font-semibold">Portfolio Link (Behance/Vimeo/Website)</label>
                    <div class="relative">
                        <i data-lucide="link" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-textSecondary"></i>
                        <input type="url" placeholder="https://" class="w-full h-[52px] bg-surface border border-border rounded-sm text-body text-textPrimary pl-10 pr-4 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>

            </div>

            <!-- Primary Action -->
            <button onclick="window.location.href='./A-7-HomeDashboard.html'" class="w-full h-[52px] bg-primary text-textOnPrimary rounded-md text-bodyBold flex items-center justify-center shadow-lg active:bg-primaryPressed transition-colors mt-auto mb-6">
                Next Step
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
