<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Artist - Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden ring-1 ring-border sm:rounded-[40px] flex flex-col">
        
        <div class="h-[56px] mt-12 px-2 flex items-center justify-between shrink-0 border-b border-border">
            <button onclick="window.location.href='./A-8-ArtistProfile.html'" class="w-11 h-11 flex items-center justify-center text-textPrimary active:opacity-50">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h3 class="text-h3 font-semibold text-white">Get Verified</h3>
            <div class="w-11"></div> <!-- spacer -->
        </div>

        <div class="flex-1 p-4 flex flex-col relative">
            
            <div class="flex flex-col items-center mt-8 mb-8 text-center px-4">
                <div class="w-20 h-20 bg-surfaceAlt rounded-full flex items-center justify-center mb-4 relative">
                    <i data-lucide="shield-check" class="w-10 h-10 text-primary"></i>
                    <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-success rounded-full border-[3px] border-background flex items-center justify-center">
                        <i data-lucide="check" class="w-3 h-3 text-background font-bold"></i>
                    </div>
                </div>
                <h2 class="text-h2 font-bold text-white mb-2">Verified Artist Badge</h2>
                <p class="text-body text-textSecondary">Stand out to production houses. Verified profiles receive 4x more audition calls.</p>
            </div>

            <!-- Steps -->
            <div class="bg-surface border border-border rounded-md p-4 flex flex-col gap-6">
                
                <div class="flex gap-4 items-start relative">
                    <div class="w-8 h-8 rounded-full bg-primary/20 text-primary font-bold flex items-center justify-center shrink-0 z-10">1</div>
                    <div class="w-0.5 h-16 bg-border absolute left-4 top-8 -translate-x-1/2"></div>
                    <div>
                        <h4 class="text-bodyBold text-white">Government ID</h4>
                        <p class="text-caption text-textSecondary mb-2">Upload Aadhar or PAN card</p>
                        <button class="px-4 py-1.5 bg-surfaceAlt border border-border rounded text-[11px] font-semibold text-white active:bg-border">Upload File</button>
                    </div>
                </div>

                <div class="flex gap-4 items-start relative">
                    <div class="w-8 h-8 rounded-full bg-surfaceAlt border border-border text-textSecondary font-bold flex items-center justify-center shrink-0 z-10">2</div>
                    <div class="w-0.5 h-16 bg-border absolute left-4 top-8 -translate-x-1/2"></div>
                    <div class="opacity-50">
                        <h4 class="text-bodyBold text-white">Video Selfie</h4>
                        <p class="text-caption text-textSecondary mb-2">Record a 5s selfie video</p>
                    </div>
                </div>

                <div class="flex gap-4 items-start relative">
                    <div class="w-8 h-8 rounded-full bg-surfaceAlt border border-border text-textSecondary font-bold flex items-center justify-center shrink-0 z-10">3</div>
                    <div class="opacity-50">
                        <h4 class="text-bodyBold text-white">Submit for Review</h4>
                        <p class="text-caption text-textSecondary">Takes 24-48 hours</p>
                    </div>
                </div>

            </div>
            
            <button class="w-full h-[52px] bg-primary/50 text-white/50 rounded-md text-bodyBold flex items-center justify-center shadow-lg mt-auto mb-6 pointer-events-none">
                Submit Verification
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
