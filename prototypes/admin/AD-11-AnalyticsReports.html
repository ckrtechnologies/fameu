<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameu Admin - Analytics & Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-textPrimary flex min-h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-surface border-r border-border flex flex-col shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-border gap-2">
            <i data-lucide="shield" class="w-6 h-6 text-primary"></i>
            <span class="font-bold text-white text-lg tracking-tight">Fameu Admin</span>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 px-3 flex flex-col gap-1">
            <a href="./AD-2-AdminDashboard.html" class="flex items-center gap-3 px-3 py-2 text-textSecondary hover:bg-surfaceAlt hover:text-white rounded-md transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
            </a>
            
            <div class="text-[11px] font-bold text-textSecondary uppercase tracking-wider mt-4 mb-2 px-3">Content & Operations</div>
            <a href="./AD-10-PaymentMonitoring.html" class="flex items-center gap-3 px-3 py-2 text-textSecondary hover:bg-surfaceAlt hover:text-white rounded-md transition-colors">
                <i data-lucide="credit-card" class="w-5 h-5"></i> Payments
            </a>
            <a href="./AD-11-AnalyticsReports.html" class="flex items-center gap-3 px-3 py-2.5 bg-primary/10 text-primary rounded-md font-semibold transition-colors">
                <i data-lucide="bar-chart-2" class="w-5 h-5"></i> Analytics
            </a>
            <a href="./AD-12-ContentManagement.html" class="flex items-center gap-3 px-3 py-2 text-textSecondary hover:bg-surfaceAlt hover:text-white rounded-md transition-colors">
                <i data-lucide="type" class="w-5 h-5"></i> Content / App
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 bg-background">
        
        <header class="h-16 flex items-center justify-between px-8 border-b border-border bg-surface/50 backdrop-blur-sm z-10 shrink-0">
            <h2 class="text-xl font-semibold text-white">Platform Analytics</h2>
            <button class="px-4 py-2 bg-surfaceAlt border border-border text-white rounded font-semibold text-sm hover:bg-surface transition-colors flex items-center gap-2">
                <i data-lucide="download" class="w-4 h-4"></i> Generate PDF Report
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            
            <div class="grid grid-cols-2 gap-6 mb-8">
                
                <!-- Mock Chart 1 -->
                <div class="bg-surface border border-border rounded-xl p-6 h-80 flex flex-col">
                    <h3 class="text-lg font-bold text-white mb-6">User Acquisition (Artists vs Hiring)</h3>
                    <div class="flex-1 border-b border-l border-border relative flex items-end justify-between px-4 pb-2">
                        <!-- Mock lines/bars -->
                        <div class="w-1/6 h-[40%] bg-primary/80 rounded-t"></div>
                        <div class="w-1/6 h-[20%] bg-white/50 rounded-t"></div>
                        
                        <div class="w-1/6 h-[60%] bg-primary/80 rounded-t"></div>
                        <div class="w-1/6 h-[30%] bg-white/50 rounded-t"></div>
                        
                        <div class="w-1/6 h-[90%] bg-primary/80 rounded-t"></div>
                        <div class="w-1/6 h-[45%] bg-white/50 rounded-t"></div>
                    </div>
                    <div class="flex justify-center gap-6 mt-4">
                        <div class="flex items-center gap-2"><div class="w-3 h-3 bg-primary/80 rounded"></div><span class="text-xs text-textSecondary">Artists</span></div>
                        <div class="flex items-center gap-2"><div class="w-3 h-3 bg-white/50 rounded"></div><span class="text-xs text-textSecondary">Hiring Accounts</span></div>
                    </div>
                </div>

                <!-- Mock Chart 2 -->
                <div class="bg-surface border border-border rounded-xl p-6 h-80 flex flex-col">
                    <h3 class="text-lg font-bold text-white mb-6">Auditions Posted by Category</h3>
                    <div class="flex-1 flex items-center justify-center relative">
                        <!-- Mock Donut Chart (CSS) -->
                        <div class="w-40 h-40 rounded-full border-[16px] border-primary" style="border-right-color: #333; border-bottom-color: #555;"></div>
                    </div>
                    <div class="flex justify-center gap-4 mt-4">
                        <div class="flex items-center gap-2"><div class="w-3 h-3 bg-primary rounded"></div><span class="text-xs text-textSecondary">Acting (60%)</span></div>
                        <div class="flex items-center gap-2"><div class="w-3 h-3 bg-[#555] rounded"></div><span class="text-xs text-textSecondary">Modeling (25%)</span></div>
                        <div class="flex items-center gap-2"><div class="w-3 h-3 bg-[#333] rounded"></div><span class="text-xs text-textSecondary">Other (15%)</span></div>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
